  <!-- Star shape -->
  <polygon points="30,25.5 31.2,28 33.8,28.3 31.9,30.1 32.4,32.7 30,31.4 27.6,32.7 28.1,30.1 26.2,28.3 28.8,28 " fill="#059669"/>
