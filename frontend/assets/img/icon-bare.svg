<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Icon without text — for favicon, tab bar, etc. -->
  <defs>
    <linearGradient id="bgBare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldBare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Green rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#bgBare)"/>

  <!-- Outer rotation ring -->
  <circle cx="100" cy="100" r="56" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>

  <!-- Team member dots on ring -->
  <circle cx="56" cy="72" r="5.5" fill="white" opacity="0.25"/>
  <circle cx="152" cy="112" r="5.5" fill="white" opacity="0.25"/>
  <circle cx="64" cy="140" r="5.5" fill="white" opacity="0.25"/>

  <!-- Center highlighted person -->
  <circle cx="100" cy="84" r="19" fill="white"/>
  <path d="M74 118 Q74 98 100 98 Q126 98 126 118" fill="white"/>

  <!-- Gold focus ring -->
  <circle cx="100" cy="98" r="38" fill="none" stroke="url(#goldBare)" stroke-width="3" stroke-dasharray="6 4" opacity="0.9"/>

  <!-- Rotation arrow -->
  <path d="M112 44 L118 48 L112 52" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M98 44 Q104 44 112 46" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- 1ST badge -->
  <rect x="124" y="62" width="34" height="22" rx="11" fill="#FBBF24"/>
  <text x="141" y="77" text-anchor="middle" font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="12" fill="#059669">1ST</text>
</svg>