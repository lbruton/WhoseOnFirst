<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M100 10 L185 45 L185 120 Q185 190 100 230 Q15 190 15 120 L15 45 Z" fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="3"/>

  <!-- Inner shield highlight -->
  <path d="M100 28 L170 56 L170 118 Q170 178 100 212 Q30 178 30 118 L30 56 Z" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.3"/>

  <!-- Person silhouette -->
  <circle cx="100" cy="85" r="22" fill="url(#accentGrad)"/>
  <path d="M64 140 Q64 110 100 110 Q136 110 136 140" fill="url(#accentGrad)"/>

  <!-- Clock ring around person's head -->
  <circle cx="100" cy="85" r="32" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <!-- Clock tick marks -->
  <line x1="100" y1="51" x2="100" y2="56" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="114" x2="100" y2="119" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="66" y1="85" x2="71" y2="85" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="129" y1="85" x2="134" y2="85" stroke="white" stroke-width="2" opacity="0.6"/>

  <!-- "#1" text below person -->
  <text x="100" y="178" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="36" fill="white" letter-spacing="-1">#1</text>
</svg>