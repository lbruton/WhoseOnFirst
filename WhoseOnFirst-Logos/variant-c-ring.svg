<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="vcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vcRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Green rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#vcBg)"/>

  <!-- Outer ring - represents the rotation -->
  <circle cx="100" cy="88" r="52" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>

  <!-- Three dots on the ring (team members' positions) -->
  <!-- Top-left dot -->
  <circle cx="60" cy="62" r="5" fill="white" opacity="0.25"/>
  <!-- Right dot -->
  <circle cx="148" cy="100" r="5" fill="white" opacity="0.25"/>
  <!-- Bottom-left dot -->
  <circle cx="68" cy="128" r="5" fill="white" opacity="0.25"/>

  <!-- Center highlighted person - "on first" -->
  <circle cx="100" cy="76" r="17" fill="white"/>
  <path d="M76 108 Q76 90 100 90 Q124 90 124 108" fill="white"/>

  <!-- Gold focus ring around the active person -->
  <circle cx="100" cy="88" r="34" fill="none" stroke="url(#vcRing)" stroke-width="3" stroke-dasharray="6 4" opacity="0.9"/>

  <!-- Rotation arrows on the outer ring (small, subtle) -->
  <!-- Arrow at top -->
  <path d="M108 36 L114 40 L108 44" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M96 36 Q100 36 108 38" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- "1ST" badge -->
  <rect x="120" y="55" width="32" height="20" rx="10" fill="#FBBF24"/>
  <text x="136" y="69" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="11" fill="#059669">1ST</text>

  <!-- Bottom text -->
  <text x="100" y="162" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="14" fill="white" letter-spacing="2" opacity="0.9">WHO'S ON</text>
  <text x="100" y="178" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-weight="300" font-size="10" fill="white" letter-spacing="5" opacity="0.5">FIRST</text>
</svg>