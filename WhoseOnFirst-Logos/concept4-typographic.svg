<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGrad4)"/>

  <!-- Large stylized "W" made of geometric shapes -->
  <!-- The W is constructed to subtly contain a person shape in the center valley -->
  <path d="M42 60 L62 140 L100 90 L138 140 L158 60"
        fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small dot at the center top of the W (person's head, subtle) -->
  <circle cx="100" cy="74" r="6" fill="#FCD34D"/>

  <!-- "1" subscript -->
  <text x="162" y="152" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="28" fill="white" opacity="0.9">1</text>

  <!-- Thin underline -->
  <line x1="42" y1="150" x2="148" y2="150" stroke="white" stroke-width="2" opacity="0.3"/>
</svg>