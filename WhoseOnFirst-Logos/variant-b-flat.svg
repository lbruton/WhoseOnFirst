<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="vbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Blue rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="36" ry="36" fill="url(#vbBg)"/>

  <!-- Three person silhouettes in a row -->
  <!-- Left person - low opacity -->
  <circle cx="55" cy="72" r="14" fill="white" opacity="0.2"/>
  <rect x="37" y="90" width="36" height="30" rx="12" fill="white" opacity="0.2"/>

  <!-- Right person - low opacity -->
  <circle cx="145" cy="72" r="14" fill="white" opacity="0.2"/>
  <rect x="127" y="90" width="36" height="30" rx="12" fill="white" opacity="0.2"/>

  <!-- Center person - full bright, slightly larger -->
  <circle cx="100" cy="66" r="18" fill="white"/>
  <rect x="78" y="88" width="44" height="32" rx="14" fill="white"/>

  <!-- Gold number "1" floating above center person -->
  <circle cx="100" cy="38" r="12" fill="#FBBF24"/>
  <text x="100" y="44" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="16" fill="#1D4ED8">1</text>

  <!-- Horizontal rule -->
  <line x1="36" y1="135" x2="164" y2="135" stroke="white" stroke-width="1" opacity="0.25"/>

  <!-- App name in clean type -->
  <text x="100" y="158" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="18" fill="white" letter-spacing="1">ON FIRST</text>
  <text x="100" y="174" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-weight="300" font-size="10" fill="white" letter-spacing="4" opacity="0.6">ON CALL ROTATION</text>
</svg>