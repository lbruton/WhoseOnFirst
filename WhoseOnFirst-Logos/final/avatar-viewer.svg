<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Viewer/standard user avatar — person with eye/view motif, Variant C palette -->
  <defs>
    <linearGradient id="viewerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="20" cy="20" r="19" fill="url(#viewerBg)"/>

  <!-- Person silhouette -->
  <circle cx="20" cy="15" r="5.5" fill="white"/>
  <path d="M11 28 Q11 22 20 22 Q29 22 29 28" fill="white"/>

  <!-- Small eye badge (viewer indicator) at bottom-right -->
  <circle cx="30" cy="30" r="6.5" fill="white" stroke="url(#viewerBg)" stroke-width="1.5"/>
  <!-- Eye shape -->
  <ellipse cx="30" cy="30" rx="4" ry="2.5" fill="none" stroke="#0EA5E9" stroke-width="1"/>
  <circle cx="30" cy="30" r="1.2" fill="#0EA5E9"/>
</svg>