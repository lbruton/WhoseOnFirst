<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" width="220" height="40">
  <!-- Compact banner — icon + name only, no tagline. For collapsed or tight sidebars. -->
  <defs>
    <linearGradient id="cBannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cBannerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Mini icon (32x32) -->
  <rect x="4" y="4" width="32" height="32" rx="8" ry="8" fill="url(#cBannerBg)"/>

  <!-- Mini rotation ring -->
  <circle cx="20" cy="18" r="10" fill="none" stroke="white" stroke-width="0.7" opacity="0.2"/>

  <!-- Mini team dots -->
  <circle cx="12.5" cy="12" r="1.3" fill="white" opacity="0.25"/>
  <circle cx="29" cy="20" r="1.3" fill="white" opacity="0.25"/>
  <circle cx="13.5" cy="26" r="1.3" fill="white" opacity="0.25"/>

  <!-- Mini center person -->
  <circle cx="20" cy="15" r="4" fill="white"/>
  <path d="M14 23 Q14 19 20 19 Q26 19 26 23" fill="white"/>

  <!-- Mini gold ring -->
  <circle cx="20" cy="18" r="7" fill="none" stroke="url(#cBannerGold)" stroke-width="1" stroke-dasharray="2 1.5" opacity="0.85"/>

  <!-- Mini 1ST badge -->
  <rect x="24.5" y="9" width="9" height="6" rx="3" fill="#FBBF24"/>
  <text x="29" y="13.5" text-anchor="middle" font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="3.5" fill="#059669">1ST</text>

  <!-- Wordmark -->
  <text x="44" y="25" font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15" fill="white" letter-spacing="0.3">WhoseOnFirst</text>
</svg>