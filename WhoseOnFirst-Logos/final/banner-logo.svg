<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48">
  <!-- Wide banner logo for sidebar header: icon + wordmark -->
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bannerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Mini icon (36x36 rounded square) -->
  <rect x="4" y="6" width="36" height="36" rx="9" ry="9" fill="url(#bannerBg)"/>

  <!-- Mini rotation ring -->
  <circle cx="22" cy="22" r="11.5" fill="none" stroke="white" stroke-width="0.8" opacity="0.2"/>

  <!-- Mini team dots -->
  <circle cx="13.5" cy="15.5" r="1.5" fill="white" opacity="0.25"/>
  <circle cx="32" cy="24" r="1.5" fill="white" opacity="0.25"/>
  <circle cx="15" cy="31" r="1.5" fill="white" opacity="0.25"/>

  <!-- Mini center person -->
  <circle cx="22" cy="19" r="4.5" fill="white"/>
  <path d="M15.5 27.5 Q15.5 23 22 23 Q28.5 23 28.5 27.5" fill="white"/>

  <!-- Mini gold ring -->
  <circle cx="22" cy="22" r="8" fill="none" stroke="url(#bannerGold)" stroke-width="1.2" stroke-dasharray="2 1.5" opacity="0.85"/>

  <!-- Mini 1ST badge -->
  <rect x="27" y="12" width="10" height="6.5" rx="3.2" fill="#FBBF24"/>
  <text x="32" y="17" text-anchor="middle" font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="4" fill="#059669">1ST</text>

  <!-- Wordmark text -->
  <text x="50" y="22" font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="16" fill="white" letter-spacing="0.5">WhoseOnFirst</text>

  <!-- Subtle tagline -->
  <text x="50" y="36" font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="8.5" fill="white" opacity="0.45" letter-spacing="0.3">On-Call Rotation</text>
</svg>