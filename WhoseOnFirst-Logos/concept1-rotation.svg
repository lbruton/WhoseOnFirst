<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" />

  <!-- Rotation arrows (three curved arrows forming a cycle) -->
  <!-- Arrow 1 - top -->
  <path d="M100 35 A65 65 0 0 1 156 78" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <polygon points="160,72 156,84 148,74" fill="white"/>

  <!-- Arrow 2 - bottom right -->
  <path d="M156 122 A65 65 0 0 1 78 165" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <polygon points="82,170 72,165 80,157" fill="white"/>

  <!-- Arrow 3 - bottom left -->
  <path d="M66 148 A65 65 0 0 1 44 78" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <polygon points="40,84 44,72 52,82" fill="white"/>

  <!-- Center person icon -->
  <circle cx="100" cy="88" r="16" fill="white"/>
  <path d="M74 130 Q74 108 100 108 Q126 108 126 130" fill="white"/>

  <!-- Small "1" badge -->
  <circle cx="138" cy="138" r="18" fill="#F59E0B"/>
  <text x="138" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="white">1</text>
</svg>