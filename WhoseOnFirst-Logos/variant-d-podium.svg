<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="vdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vdGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE68A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky blue rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#vdBg)"/>

  <!-- Podium blocks - three levels -->
  <!-- 2nd place block (left, shorter) -->
  <rect x="36" y="116" width="40" height="28" rx="4" fill="white" opacity="0.2"/>
  <text x="56" y="135" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14" fill="white" opacity="0.4">2</text>

  <!-- 1st place block (center, tallest) -->
  <rect x="80" y="100" width="40" height="44" rx="4" fill="url(#vdGold)"/>
  <text x="100" y="133" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="22" fill="#0284C7">1</text>

  <!-- 3rd place block (right, shortest) -->
  <rect x="124" y="124" width="40" height="20" rx="4" fill="white" opacity="0.15"/>
  <text x="144" y="139" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="12" fill="white" opacity="0.35">3</text>

  <!-- Person on 2nd place -->
  <circle cx="56" cy="100" r="10" fill="white" opacity="0.3"/>
  <rect x="46" y="90" width="0" height="0"/>

  <!-- Person on 1st place - highlighted! -->
  <circle cx="100" cy="78" r="14" fill="white"/>
  <path d="M82 98 Q82 86 100 86 Q118 86 118 98" fill="white"/>

  <!-- Person on 3rd place -->
  <circle cx="144" cy="108" r="9" fill="white" opacity="0.25"/>

  <!-- Crown/star above 1st place person -->
  <polygon points="100,50 103,58 112,58 105,63 108,72 100,67 92,72 95,63 88,58 97,58" fill="#FDE68A" opacity="0.9"/>

  <!-- Bottom text -->
  <text x="100" y="168" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="white" letter-spacing="2">WHO'S ON FIRST</text>
</svg>