# ============================================
# WhoseOnFirst - Production (Portainer GitOps)
# ============================================
# Deployed via Portainer stack from GitHub repo.
# GitOps redeploy rebuilds the image but preserves
# the named volume — your database survives redeploys.
# ============================================

services:
  whoseonfirst:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whoseonfirst
    restart: unless-stopped

    # Port mapping — Cloudflare tunnel expects 8900
    ports:
      - "8900:8000"

    # Named volume — persists across GitOps redeploys
    volumes:
      - whoseonfirst-data:/app/data

    # Environment variables injected via Portainer stack config
    environment:
      - DATABASE_URL=sqlite:///./data/whoseonfirst.db
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - NOTIFICATION_TIMEZONE=${NOTIFICATION_TIMEZONE:-America/Chicago}
      - NOTIFICATION_HOUR=${NOTIFICATION_HOUR:-8}
      - NOTIFICATION_MINUTE=${NOTIFICATION_MINUTE:-0}
      - SECRET_KEY=${SECRET_KEY}
      - SECURE_COOKIES=true

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volume — survives container rebuilds and GitOps redeploys
volumes:
  whoseonfirst-data:
    driver: local
